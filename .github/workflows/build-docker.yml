name: Build Docker Image

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Aggressively free up unused disk space
        run: |
          # Remove large, common, unneeded packages on Linux runners
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 
          sudo rm -rf /opt/ghc /usr/share/swift /usr/local/.ghcup

      - name: Clean up unused Docker resources to free space
        run: docker system prune -a -f
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: shared-code-environment:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      
      - name: Test Docker image
        run: |
          docker run --rm shared-code-environment:latest
